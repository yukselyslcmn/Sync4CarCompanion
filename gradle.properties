# Project-wide Gradle settings
# --enable-native-access=ALL-UNNAMED: Android Studio JBR 25+ üzerinde kısıtlı native erişim uyarısını önler
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX & Modern Android Gradle Plugin defaults
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
